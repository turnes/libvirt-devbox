---
- name: Install KVM/libvirt packages
  become: true
  ansible.builtin.apt:
    name:
      - qemu-system-x86
      - libvirt-daemon-system
      - libvirt-clients
      - bridge-utils
      - virtinst
      - cpu-checker
      - bash-completion
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Enable and start libvirtd
  become: true
  ansible.builtin.systemd:
    name: libvirtd
    enabled: true
    state: started

- name: Add {{ kvm_user }} to the libvirt and kvm groups
  become: true
  ansible.builtin.user:
    name: "{{ kvm_user }}"
    groups:
      - libvirt
      - kvm
    append: true
  when: kvm_user is defined
# libvirt-clients ships virsh's bash completion under
# /usr/share/bash-completion/completions/, sourced automatically by the
# bash-completion package above.
